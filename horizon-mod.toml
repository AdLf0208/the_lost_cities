id = "the_lost_cities"
name = "The Lost Cities"
version = "0.1.2"
description = """Generate cities all over the world. This slice registers the lostcities:lostcity
dimension from the jar's dimension_type values with a deterministic city chunk generator:
two jar parts are decoded by a clean-room Rust decoder and laid at two heights — the street
(parts/street_straight.json) at y=90 and a six-layer building (parts/building1_1.json) at y=72,
whose # char resolves through a jar variant file and whose merged palette spans bricks_standard,
common and the two glass groups selected by styles/standard.json. Block tags, chest loot tables
and the language file are carried as before. The other 206 parts and Java-assembled structures
remain blocked: the pin has no configured-feature registrar and R11 refuses a level reset."""
authors = ["McJty (upstream, MIT)", "AdLf0208 (port)"]
api = "0.2"
side = "both"
capabilities = ["registries"]
# The registry id is the campaign's port id; the jar's content namespace is
# `lostcities`, so it must be listed for the carried tags/loot to load and for
# the dimension registration to name the mod's own id.
namespaces = ["lostcities"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
