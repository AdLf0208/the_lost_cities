id = "the_lost_cities"
name = "The Lost Cities"
version = "0.1.10"
description = """Generate cities all over the world. This slice registers the lostcities:lostcity
dimension from the jar's dimension_type values with a deterministic city chunk generator:
ten jar parts are decoded by a clean-room Rust decoder and laid at ten heights — the street
(parts/street_straight.json) at y=90, a six-layer building (parts/building1_1.json) at y=72 whose
# char resolves through a jar variant file, the six-layer horizontal rail line
(parts/rails_horizontal.json) at y=54 whose e/f chars come verbatim from palettes/rails.json,
the six-layer rail bend (parts/rails_bend.json) at y=36 whose k/r/s/m chars write the
north_south, north_west, south_west and powered north_south rail shapes, the six-layer
three-way rail split (parts/rails_3split.json) at y=18 whose n/q chars write the north_east
and south_east rail shapes, the eighteen-layer rail descent (parts/rails_down2.json) at
y=4 whose j/i chars write the ascending_east and powered ascending_east rail shapes, and the
twelve-layer first rail descent (parts/rails_down1.json) at y=100 whose :/_ chars write
minecraft:iron_bars and bottom smooth-stone slabs from palettes/default.json, and the
six-layer second building (parts/building1_2.json) at y=116 whose Q char writes
minecraft:quartz_block from palettes/default.json — quartz is placed by no other decoded
part. A ninth, six-layer city centre (parts/center00_1.json) at y=128 whose ) char
writes minecraft:quartz_stairs[facing=south,half=bottom,shape=straight] from
palettes/default.json — stairs are placed by no other decoded part. A tenth,
six-layer shopping-open front (parts/shopping_open01_1.json) at y=140 whose w
char writes minecraft:cobblestone_wall from palettes/default.json — a wall is
placed by no other decoded part. Block tags, chest loot tables and the language
file are carried as before.
The other 198 parts and Java-assembled structures remain blocked: the pin has no
configured-feature registrar and R11 refuses a level reset."""
authors = ["McJty (upstream, MIT)", "AdLf0208 (port)"]
api = "0.2"
side = "both"
capabilities = ["registries"]
# The registry id is the campaign's port id; the jar's content namespace is
# `lostcities`, so it must be listed for the carried tags/loot to load and for
# the dimension registration to name the mod's own id.
namespaces = ["lostcities"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
